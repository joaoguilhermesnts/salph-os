# GRUB nos dois modos. Em UEFI o grub-install do Debian instala o shim
# assinado (Secure Boot). O caminho de fallback (EFI/BOOT/BOOTX64.EFI) é feito
# pelo script salph-finish com --force-extra-removable, que copia o shim
# corretamente; o fallback do Calamares copiaria só o GRUB e falharia com SB.
---
efiBootLoader: "grub"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "salph"
installEFIFallback: false
