---
# Chaves novas (3.3) e antigas, para compatibilidade.
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        300MiB
    label:              "EFI"
efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: EFI

# zram já fornece swap; swap em disco só para quem quer hibernar.
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice:      none

drawNestedPartitions:   false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
defaultFileSystemType:  "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]

# Criptografia de disco completo. LUKS1: o GRUB 2.12 não abre LUKS2 com Argon2.
enableLuksAutomatedPartitioning: true
luksGeneration:         luks1
