# Escreve em /etc/default/grub.d/ em vez de alterar /etc/default/grub (conffile).
---
overwrite: false
prefer_grub_d: true
keep_distributor: false
always_use_defaults: true
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "0"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: false
