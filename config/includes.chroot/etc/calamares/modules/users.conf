---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - cdrom
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - bluetooth
    - lpadmin
# Debian já libera %sudo no /etc/sudoers; só adiciona o usuário ao grupo.
sudoersGroup: sudo
sudoersConfigureWithGroup: true

setRootPassword: false
doAutologin: false

passwordRequirements:
    nonempty: true
    minLength: 8
    maxLength: -1
allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names: [ root ]

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "salph-${cpu}"
