# SALPH OS — Calamares 3.3
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

instances:
- id:       salph-prepare
  module:   shellprocess
  config:   shellprocess-salph-prepare.conf
- id:       salph-finish
  module:   shellprocess
  config:   shellprocess-salph-finish.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@salph-prepare
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess@salph-finish
  - umount
- show:
  - finished

branding: salph

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
